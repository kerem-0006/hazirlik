<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap">
<title>Reading Çalışması 1</title>
<style>
:root { --bg:#7a3214; --sheet:#323232; --line:#262626; --ink:#e3e3e3; --muted:#c9cdd4; --teal:#ffa070; --bad:#ff8a80; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 17px/1.5 "Helvetica Neue", Arial, system-ui, sans-serif; padding: 16px; }
form { width: min(420px, 100%); display: grid; gap: 12px; background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.30), 0 10px 28px rgba(0,0,0,.35); }
h1 { margin: 0 0 8px; display: flex; align-items: center; justify-content: center; gap: 9px; line-height: 1; }
/* logo ile yazı tek parça, "B · yan yana, çizgili" (Kerem 2026-10-20 14:39): Mars | iki satır yazı */
.logo .m { height: 36px; width: auto; flex: none; }
.logo .a { font: 800 12.5px/1.05 "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; letter-spacing: .01em; color: var(--ink); text-align: left; border-left: 2px solid #5a5a5a; padding: 2px 0 2px 9px; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
.gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
p { margin: 0; color: var(--muted); font-size: 15px; }
input { font: inherit; color: var(--ink); background: #464646; border: 1px solid #575757; border-radius: 10px; padding: 12px; }
input:focus { outline: 2px solid var(--teal); border-color: transparent; }
button { font: 700 16px/1 inherit; font-family: inherit; color: var(--sheet); background: var(--teal); border: 0; border-radius: 10px; padding: 14px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#hata { color: var(--bad); min-height: 1.5em; text-align: center; }
.satir { display: flex; gap: 8px; }
.satir input { flex: 1; min-width: 0; }
.satir button { padding: 0 16px; font-size: 14px; }
.satir input { font-size: 15px; padding: 8px 11px; border-radius: 9px; }
.satir button { border-radius: 9px; }
/* iPhone 16 px'ten küçük kutuya dokununca ekranı yakınlaştırır; telefonda 16 px */
@media (max-width: 600px) { .satir input { font-size: 16px; } }
</style>
</head>
<body>
<form id="f" hidden>
  <h1 class="logo"><img class="m" src="mars-logo.png" alt="Mars"><span class="a">dil geliştirme<br>paneli</span></h1>
  <div class="satir">
    <input id="s" type="password" autocomplete="current-password" aria-label="Şifre" placeholder="Şifre" required>
    <button id="b" type="submit">Gir</button>
  </div>
  <p id="hata" role="alert"></p>
</form>

      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bayt(IV) }, k, bayt(VERI)); })
      .then(function (d) { var html = new TextDecoder().decode(d);
        // sayfa tam yüklenmeden document.open çağrılırsa şifre ekranı silinmez, içerik altına eklenir; yüklenmeyi bekle
        return new Promise(function (r) { if (document.readyState === 'complete') r(); else addEventListener('load', function () { r(); }, { once: true }); })
          .then(function () { document.open(); document.write(html); document.close(); }); });
  }
  function formuGoster() { var f = document.getElementById('f'); f.hidden = false; document.getElementById('s').focus(); }
  // Kerem 2026-10-20 14:10: "her girişte şifre istenecek" → anahtar yalnız bu sekmede (sessionStorage), sekme kapanınca silinir; eski kalıcı kaydı da sil
  try { localStorage.removeItem(ANAHTAR); } catch (e) {}
  // Kerem'in bilgisayarı: kalıcı cihaz kaydı varsa şifre hiç sorulmaz
  var hatirla = location.hash === '#bu-cihazi-hatirla';
  if (location.hash === '#bu-cihazi-unut') { try { localStorage.removeItem(CIHAZ); sessionStorage.removeItem(ANAHTAR); } catch (e) {} }
  if (hatirla || location.hash === '#bu-cihazi-unut') history.replaceState(null, '', location.pathname + location.search);
  // Kerem'e özel şifresiz bağlantı (Kerem 2026-10-20 14:46): adres #k=<anahtar> ile gelirse şifre sorulmaz, tarayıcı da kalıcı hatırlanır.
  // Anahtar yalnız 08-VERI-HAVUZU/sirlar.md içinde ve panelin site tuşunda durur; adres çubuğundan hemen silinir.
  var ozel = null, m = location.hash.match(/^#k=([A-Za-z0-9_-]{43})$/);
  if (m) { ozel = m[1].replace(/-/g, '+').replace(/_/g, '/') + '='; hatirla = true; history.replaceState(null, '', location.pathname + location.search); }
  var kayitli = ozel; try { kayitli = kayitli || localStorage.getItem(CIHAZ) || sessionStorage.getItem(ANAHTAR); } catch (e) {}
  (kayitli ? ac(bayt(kayitli)).then(function () { try { sessionStorage.setItem(ANAHTAR, kayitli); if (hatirla) localStorage.setItem(CIHAZ, kayitli); } catch (e) {} }) : Promise.reject()).catch(formuGoster);
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var b = document.getElementById('b'), h = document.getElementById('hata'); b.disabled = true; h.textContent = '';
    crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('s').value), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bayt(TUZ), iterations: TEKRAR, hash: 'SHA-256' }, k, 256); })
      .then(function (ham) { var s = btoa(String.fromCharCode.apply(null, new Uint8Array(ham))); return ac(ham).then(function () { try { sessionStorage.setItem(ANAHTAR, s); if (hatirla) localStorage.setItem(CIHAZ, s); } catch (e) {} }); })
      .catch(function () { b.disabled = false; h.textContent = 'Şifre yanlış, tekrar dene.'; });
  });
})();
